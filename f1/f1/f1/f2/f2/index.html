<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول زیبا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn', sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content:''; position:fixed; border-radius:50%; filter:blur(80px); opacity:0.4; z-index:0;
  }
  body::before { width:400px; height:400px; background:#ec4899; top:-100px; right:-100px; animation:float 8s ease-in-out infinite; }
  body::after  { width:350px; height:350px; background:#06b6d4; bottom:-100px; left:-100px; animation:float 10s ease-in-out infinite reverse; }

  @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }

  .card {
    position:relative; z-index:1;
    width: 100%; max-width: 1000px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  h1 {
    text-align:center;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight:700; color:#fff;
    margin-bottom: 28px;
    background: linear-gradient(90deg, #f0abfc, #67e8f9);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }

  /* ---------- نوار وضعیت ---------- */
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50px; padding: 8px 18px;
    margin: 0 auto 24px; width: fit-content;
    font-size: 0.8rem; color: #c7d2fe; transition: all 0.3s;
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #facc15;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(1.3); }
  }
  .status-bar.ok .status-dot { background:#10b981; animation:none; }
  .status-bar.err .status-dot { background:#ef4444; animation:none; }

  /* ---------- لودینگ ---------- */
  .loader { display: none; text-align: center; padding: 40px 0; }
  .loader.show { display: block; }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(167,139,250,0.2);
    border-top-color: #a78bfa;
    border-radius: 50%; margin: 0 auto 14px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { color:#c7d2fe; font-size:0.9rem; }

  /* ---------- منطقه بارگذاری ---------- */
  .upload-area {
    display: none;
    border: 2px dashed rgba(167,139,250,0.5);
    border-radius: 18px;
    padding: 40px 20px; text-align: center;
    background: rgba(167,139,250,0.08);
    cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px;
  }
  .upload-area.show { display: block; animation: fadeIn 0.5s ease; }
  .upload-area:hover, .upload-area.dragover {
    border-color: #a78bfa;
    background: rgba(167,139,250,0.18);
    transform: scale(1.01);
  }
  .upload-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
  .upload-text { color: #e0e7ff; font-size: 0.95rem; font-weight: 500; margin-bottom: 6px; }
  .upload-hint { color: #94a3b8; font-size: 0.8rem; }
  .upload-area input[type="file"] { display: none; }

  /* ---------- جدول ---------- */
  .table-wrapper {
    overflow-x: auto;
    border-radius: 16px;
    display: none;
  }
  .table-wrapper.show { display: block; animation: fadeIn 0.5s ease; }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    border-radius: 16px;
    min-width: 320px;
  }

  thead th {
    background: linear-gradient(135deg, #7c3aed, #db2777);
    color:#fff; font-weight:700;
    padding: 18px 16px; text-align: center;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing: 0.5px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
  }
  thead th:first-child { border-top-right-radius: 16px; }
  thead th:last-child  { border-top-left-radius: 16px; }

  tbody tr { background: rgba(255,255,255,0.04); transition: all 0.3s ease; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,0.07); }
  tbody tr:hover { background: rgba(167,139,250,0.25); transform: scale(1.005); }

  tbody td {
    padding: 16px;
    text-align: center;
    color: #e0e7ff;
    font-size: clamp(0.8rem, 2.4vw, 0.95rem);
    font-weight: 500;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: color 0.3s;
  }
  tbody tr:hover td { color:#fff; }
  tbody tr:last-child td { border-bottom:none; }

  .table-wrapper::-webkit-scrollbar { height: 6px; }
  .table-wrapper::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius:10px; }
  .table-wrapper::-webkit-scrollbar-thumb { background: linear-gradient(90deg,#a78bfa,#f0abfc); border-radius:10px; }

  /* ---------- دکمه‌ها ---------- */
  .reload-btn {
    display: none; margin: 18px auto 0;
    background: rgba(255,255,255,0.08); color: #c7d2fe;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 20px; border-radius: 12px;
    font-family: 'Vazirmatn', sans-serif; font-size: 0.85rem;
    font-weight: 500; cursor: pointer; transition: all 0.3s;
  }
  .reload-btn:hover { background: rgba(255,255,255,0.15); color:#fff; }
  .reload-btn.show { display: block; animation: fadeIn 0.4s ease; }

  .error-msg {
    display: none;
    color: #fca5a5;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 12px 16px; border-radius: 12px;
    font-size: 0.85rem; text-align: center;
    margin-top: 16px; line-height: 1.6;
  }
  .error-msg.show { display: block; }

  @media (max-width: 600px) {
    .card { padding: 24px 14px; border-radius: 20px; }
    thead th { padding: 14px 10px; font-size: 0.8rem; }
    tbody td { padding: 12px 10px; font-size: 0.8rem; }
    .upload-area { padding: 30px 14px; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1 id="tableTitle">در حال بارگذاری...</h1>

    <div class="status-bar" id="statusBar">
      <span class="status-dot"></span>
      <span id="statusText">در حال بررسی...</span>
    </div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">در حال خواندن data.json...</div>
    </div>

    <div class="upload-area" id="uploadArea">
      <span class="upload-icon">📁</span>
      <div class="upload-text">فایل data.json را اینجا رها کن</div>
      <div class="upload-hint">یا کلیک کن تا فایل را انتخاب کنی</div>
      <input type="file" id="fileInput" accept=".json,application/json">
    </div>

    <div class="table-wrapper" id="tableWrapper">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <button class="reload-btn" id="reloadBtn">🔄 بارگذاری فایل دیگر</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const tableWrapper = document.getElementById('tableWrapper');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const tableTitle = document.getElementById('tableTitle');
    const reloadBtn = document.getElementById('reloadBtn');
    const errorMsg = document.getElementById('errorMsg');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    const loader = document.getElementById('loader');

    // تشخیص محیط
    const isServer = location.protocol === 'http:' || location.protocol === 'https:';

    window.addEventListener('DOMContentLoaded', () => {
      if (isServer) {
        setStatus('ok', 'حالت سرور - خواندن خودکار data.json');
        loader.classList.add('show');
        autoLoadFromServer();
      } else {
        setStatus('err', 'حالت محلی - فایل را انتخاب کن');
        tableTitle.textContent = 'جدول من';
        uploadArea.classList.add('show');
        setupLocalUpload();
      }
    });

    // حالت سرور
    function autoLoadFromServer() {
      fetch('data.json')
        .then(res => {
          if (!res.ok) throw new Error('فایل data.json پیدا نشد (کد ' + res.status + ')');
          return res.json();
        })
        .then(data => {
          loader.classList.remove('show');
          renderTable(data);
        })
        .catch(err => {
          loader.classList.remove('show');
          setStatus('err', 'خطا در خواندن');
          showError('❌ ' + err.message + '<br><br>💡 می‌تونی فایل رو دستی هم بارگذاری کنی:');
          uploadArea.classList.add('show');
          setupLocalUpload();
        });
    }

    // حالت محلی
    function setupLocalUpload() {
      uploadArea.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) readLocalFile(e.target.files[0]);
      });

      ['dragenter', 'dragover'].forEach(ev =>
        uploadArea.addEventListener(ev, (e) => {
          e.preventDefault();
          uploadArea.classList.add('dragover');
        })
      );
      ['dragleave', 'drop'].forEach(ev =>
        uploadArea.addEventListener(ev, (e) => {
          e.preventDefault();
          uploadArea.classList.remove('dragover');
        })
      );
      uploadArea.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files[0];
        if (file) readLocalFile(file);
      });

      reloadBtn.addEventListener('click', () => {
        uploadArea.classList.add('show');
        tableWrapper.classList.remove('show');
        reloadBtn.classList.remove('show');
        fileInput.value = '';
        errorMsg.classList.remove('show');
      });
    }

    function readLocalFile(file) {
      if (!file.name.endsWith('.json')) {
        showError('❌ فقط فایل با پسوند .json قابل قبول است');
        return;
      }
      errorMsg.classList.remove('show');

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          renderTable(data);
          setStatus('ok', 'فایل با موفقیت خوانده شد');
        } catch (err) {
          showError('❌ فایل JSON معتبر نیست: ' + err.message);
        }
      };
      reader.onerror = () => showError('❌ خطا در خواندن فایل');
      reader.readAsText(file, 'UTF-8');
    }

    // رندر جدول - پشتیبانی از هر تعداد ستون
    function renderTable(data) {
      if (!data.headers || !data.rows) {
        showError('❌ فایل باید شامل "headers" و "rows" باشد');
        return;
      }
      if (!Array.isArray(data.headers) || data.headers.length === 0) {
        showError('❌ حداقل یک ستون لازم است');
        return;
      }

      tableTitle.textContent = data.title || 'جدول بدون عنوان';

      tableHead.innerHTML = '';
      data.headers.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tableHead.appendChild(th);
      });

      tableBody.innerHTML = '';
      data.rows.forEach(row => {
        const tr = document.createElement('tr');
        // به تعداد ستون‌ها سلول می‌سازیم
        for (let i = 0; i < data.headers.length; i++) {
          const td = document.createElement('td');
          td.textContent = (row && row[i] !== undefined) ? row[i] : '';
          tr.appendChild(td);
        }
        tableBody.appendChild(tr);
      });

      uploadArea.classList.remove('show');
      tableWrapper.classList.add('show');

      if (!isServer) reloadBtn.classList.add('show');
    }

    function setStatus(type, text) {
      statusBar.classList.remove('ok', 'err');
      if (type) statusBar.classList.add(type);
      statusText.textContent = text;
    }

    function showError(msg) {
      errorMsg.innerHTML = msg;
      errorMsg.classList.add('show');
    }
  </script>

</body>
</html>
