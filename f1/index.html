<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>—</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#6366f1; --p2:#8b5cf6;
  --text:#0f172a; --muted:#64748b;
  --card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;
  background:
    radial-gradient(1200px 600px at 8% -10%,#dbeafe 0%,transparent 55%),
    radial-gradient(1000px 600px at 110% 15%,#ede9fe 0%,transparent 55%),
    linear-gradient(180deg,#f8fafc 0%,#eef2ff 100%);
  background-attachment:fixed;
  color:var(--text);min-height:100vh;line-height:1.7;
  padding:28px 16px;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1080px;margin:0 auto}

.site-header{text-align:center;margin-bottom:26px}
.site-title{
  font-size:clamp(1.55rem,4.2vw,2.35rem);
  font-weight:800;line-height:1.35;
  background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.site-subtitle{color:var(--muted);font-size:.98rem;margin-top:6px}

.section{margin:18px 0;line-height:1.95;color:#334155}
.section img{max-width:100%;border-radius:14px;display:block;margin:8px auto}
.section a{color:var(--p1)}
.section h2,.section h3{margin:12px 0 6px;color:var(--text)}
.section ul,.section ol{padding-inline-start:22px;margin:8px 0}
.section code{background:#f1f5f9;padding:2px 6px;border-radius:6px;font-size:.9em}

.picker-wrap{display:none;margin-bottom:24px}
.picker-wrap.visible{display:block}
.picker-label{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:40px 24px;
  border:2px dashed #a5b4fc;border-radius:22px;
  background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
  color:#4f46e5;font-weight:600;cursor:pointer;text-align:center;
  transition:all .25s ease;
}
.picker-label:hover{
  border-color:#6366f1;background:#fff;transform:translateY(-2px);
  box-shadow:0 16px 36px -14px rgba(99,102,241,.45);
}
.picker-label svg{width:42px;height:42px;stroke:currentColor}

.folder-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;margin:22px 0;
}
.folder-btn{
  position:relative;isolation:isolate;
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:76px;padding:20px 22px;
  font-family:inherit;font-size:1.05rem;font-weight:600;
  color:#fff;text-decoration:none;text-align:center;
  background:linear-gradient(135deg,var(--p1),var(--p2));
  border:none;border-radius:18px;cursor:pointer;
  overflow:hidden;
  box-shadow:
    0 10px 22px -8px rgba(99,102,241,.55),
    inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .22s ease,box-shadow .25s ease;
  animation:pop .45s cubic-bezier(.34,1.56,.64,1) backwards;
  word-break:break-word;-webkit-tap-highlight-color:transparent;
}
.folder-btn::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),
             rgba(255,255,255,.28),transparent 45%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.folder-btn:hover::before{opacity:1}
.folder-btn:hover{
  transform:translateY(-4px);
  box-shadow:
    0 22px 40px -12px rgba(99,102,241,.7),
    inset 0 1px 0 rgba(255,255,255,.3);
}
.folder-btn:active{transform:translateY(-1px)}
.folder-btn.active{
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  box-shadow:
    0 20px 40px -12px rgba(239,68,68,.65),
    inset 0 1px 0 rgba(255,255,255,.3);
}
.folder-btn .num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:32px;height:32px;padding:0 9px;
  border-radius:999px;background:rgba(255,255,255,.22);
  font-size:.85rem;font-weight:700;backdrop-filter:blur(4px);
}
@keyframes pop{
  from{opacity:0;transform:translateY(14px) scale(.94)}
  to  {opacity:1;transform:translateY(0) scale(1)}
}

.status{
  grid-column:1/-1;display:flex;align-items:center;justify-content:center;
  padding:44px 20px;
}
.spinner{
  width:20px;height:20px;border:3px solid #c7d2fe;
  border-top-color:#6366f1;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.content-card{
  background:var(--card);border-radius:22px;padding:10px;
  box-shadow:
    0 24px 45px -22px rgba(15,23,42,.28),
    0 2px 6px -1px rgba(15,23,42,.06);
  overflow:hidden;animation:pop .35s ease both;margin-top:20px;
}
.content-card iframe{
  display:block;width:100%;min-height:62vh;
  border:0;border-radius:15px;background:#fff;
}

.site-footer{
  margin-top:36px;padding-top:20px;
  border-top:1px solid #e2e8f0;
  text-align:center;color:var(--muted);font-size:.9rem;
}
.site-footer:empty{display:none;border:none}

.empty-msg{
  grid-column:1/-1;text-align:center;padding:40px 20px;
  color:var(--muted);
}

@media (max-width:640px){
  body{padding:18px 12px}
  .folder-grid{grid-template-columns:1fr;gap:12px}
  .folder-btn{min-height:66px;font-size:1rem;border-radius:16px}
  .content-card{padding:8px;border-radius:18px}
  .content-card iframe{border-radius:12px;min-height:70vh}
}
</style>
</head>
<body>

<div class="container">

  <header class="site-header" id="siteHeader" style="display:none">
    <h1 class="site-title" id="siteTitle"></h1>
    <p class="site-subtitle" id="siteSubtitle"></p>
  </header>

  <div class="section" id="beforeSection" style="display:none"></div>

  <div class="picker-wrap" id="pickerWrap">
    <label class="picker-label" for="folderPicker">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
        <path d="M12 11v6M9 14h6"/>
      </svg>
      <span>انتخاب پوشه</span>
      <input type="file" id="folderPicker" webkitdirectory directory multiple hidden />
    </label>
  </div>

  <main id="menu" class="folder-grid">
    <div class="status"><span class="spinner"></span></div>
  </main>

  <div class="section" id="afterSection" style="display:none"></div>

  <section id="content"></section>

  <footer class="site-footer" id="siteFooter" style="display:none"></footer>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- apply config ---------- */
function applyTheme(theme){
  if(!theme || typeof theme !== 'object') return;
  const r = document.documentElement.style;
  if(theme.primary)   r.setProperty('--p1', theme.primary);
  if(theme.secondary) r.setProperty('--p2', theme.secondary);
  if(theme.text)      r.setProperty('--text', theme.text);
  if(theme.muted)     r.setProperty('--muted', theme.muted);
  if(theme.card)      r.setProperty('--card', theme.card);
  if(theme.background){
    document.body.style.background = theme.background;
    document.body.style.backgroundAttachment = 'fixed';
  }
}

function applyCustomCss(css){
  if(typeof css !== 'string' || !css.trim()) return;
  const s = document.createElement('style');
  s.textContent = css;
  document.head.appendChild(s);
}

function setHtml(id, value){
  const el = $(id);
  if(!el) return;
  if(value == null || value === ''){ el.style.display = 'none'; return; }
  el.innerHTML = value;
  el.style.display = '';
}

function normalize(raw){
  if(raw == null) return {};
  if(typeof raw === 'string') return { title: raw };
  if(typeof raw !== 'object') return {};
  return raw;
}

function applyConfig(raw){
  const cfg = normalize(raw);

  applyTheme(cfg.theme);
  applyCustomCss(cfg.customCss);

  const header = $('siteHeader');
  const hasTitle    = typeof cfg.title === 'string' && cfg.title.trim();
  const hasSubtitle = typeof cfg.subtitle === 'string' && cfg.subtitle.trim();

  if(hasTitle || hasSubtitle){
    header.style.display = '';
    if(hasTitle){
      $('siteTitle').textContent = cfg.title;
      document.title = cfg.title;
    }else{
      $('siteTitle').style.display = 'none';
    }
    if(hasSubtitle){
      $('siteSubtitle').innerHTML = cfg.subtitle;
    }else{
      $('siteSubtitle').style.display = 'none';
    }
  }

  setHtml('beforeSection', cfg.beforeFolders);
  setHtml('afterSection',  cfg.afterFolders);
  setHtml('siteFooter',    cfg.footer);
}

/* ---------- server detection ---------- */
async function isServer(){
  try{
    await fetch('nameT.json', {cache:'no-store', method:'HEAD'});
    return true;
  }catch{ return false; }
}

/* ---------- server loaders ---------- */
async function loadConfigFromServer(){
  try{
    const r = await fetch('nameT.json', {cache:'no-store'});
    if(!r.ok) return {};
    return await r.json();
  }catch{ return {}; }
}

async function discoverFromServer(){
  const out = [];
  for(let i=1;i<=1000;i++){
    const folder = 'f'+i;
    try{
      const r = await fetch(folder+'/nameB.txt',{cache:'no-store'});
      if(!r.ok) break;
      const ct = r.headers.get('content-type') || '';
      if(ct.includes('text/html')) break;
      const t = (await r.text()).trim() || folder;
      out.push({folder, display:t});
    }catch{ break; }
  }
  return out;
}

/* ---------- local loaders ---------- */
function groupLocal(list){
  const sub = {};
  let configFile = null;
  for(const f of list){
    const p = (f.webkitRelativePath || '').split('/');
    if(p.length === 2 && p[1].toLowerCase() === 'namet.json') configFile = f;
    if(p.length < 3) continue;
    const name = p[1];
    const rel  = p.slice(2).join('/');
    (sub[name] ||= {})[rel] = f;
  }
  return { sub, configFile };
}

async function loadConfigFromLocal(list){
  const { configFile } = groupLocal(list);
  if(!configFile) return {};
  try{ return JSON.parse(await configFile.text()); }
  catch{ return {}; }
}

async function discoverFromLocal(list){
  const { sub } = groupLocal(list);
  const out = [];
  for(let i=1;i<=1000;i++){
    const folder = 'f'+i;
    const files = sub[folder];
    if(!files) break;
    let display = folder;
    if(files['nameB.txt']){
      const t = (await files['nameB.txt'].text()).trim();
      if(t) display = t;
    }
    out.push({folder, display});
  }
  return out;
}

/* ---------- build menu ---------- */
function buildMenu(folders, mode){
  const menu = $('menu');
  menu.innerHTML = '';

  if(!folders.length){
    menu.innerHTML = `<div class="empty-msg">هیچ پوشه‌ای پیدا نشد.</div>`;
    return;
  }

  folders.forEach(({folder, display}, idx)=>{
    const el = document.createElement(mode==='server' ? 'button' : 'a');
    el.className = 'folder-btn';
    el.style.animationDelay = (idx*45)+'ms';

    if(mode === 'local'){
      el.href = folder + '/index.html';
      el.target = '_blank';
      el.rel = 'noopener';
    }else{
      el.type = 'button';
    }

    el.innerHTML = `<span class="num">${idx+1}</span><span>${display}</span>`;

    el.addEventListener('mousemove', e=>{
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left)+'px');
      el.style.setProperty('--my', (e.clientY - r.top)+'px');
    });

    if(mode === 'server'){
      el.addEventListener('click', ()=>{
        menu.querySelectorAll('.folder-btn')
            .forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        renderIframe(folder + '/index.html');
      });
    }

    menu.appendChild(el);
  });
}

function renderIframe(src){
  const content = $('content');
  content.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'content-card';
  const iframe = document.createElement('iframe');
  iframe.src = src;
  card.appendChild(iframe);
  content.appendChild(card);
  card.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- init ---------- */
(async function init(){
  if(await isServer()){
    applyConfig(await loadConfigFromServer());
    buildMenu(await discoverFromServer(), 'server');
    return;
  }

  $('menu').innerHTML = '';
  $('pickerWrap').classList.add('visible');

  $('folderPicker').addEventListener('change', async e=>{
    const files = Array.from(e.target.files);
    if(!files.length) return;

    $('menu').innerHTML = `<div class="status"><span class="spinner"></span></div>`;

    const cfg = await loadConfigFromLocal(files);
    const folders = await discoverFromLocal(files);

    applyConfig(cfg);
    $('pickerWrap').classList.remove('visible');
    buildMenu(folders, 'local');
  });
})();
</script>

</body>
</html>
